<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4a1e">
<meta name="color-scheme" content="light dark">
<title>線上中國象棋</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="conn" class="conn" hidden></div>
<div id="toast" class="toast" hidden></div>

<!-- 暱稱 -->
<section id="scrNick" class="screen" hidden>
  <div class="card nick-card">
    <h1>線上中國象棋</h1>
    <p class="muted">免註冊，輸入暱稱即可開始</p>
    <form id="nickForm" autocomplete="off">
      <input id="nickInput" maxlength="24" placeholder="暱稱（1–12 字）" enterkeyhint="go" required>
      <p id="nickErr" class="err" hidden></p>
      <button class="btn primary wide" type="submit">進入大廳</button>
    </form>
  </div>
</section>

<!-- 大廳 -->
<section id="scrLobby" class="screen" hidden>
  <header class="topbar">
    <h1>大廳</h1>
    <div class="topbar-r">
      <button id="btnSound" class="btn ghost sm" type="button" aria-pressed="false">音效：關</button>
      <button id="btnNick" class="btn ghost sm" type="button"></button>
    </div>
  </header>
  <div class="lobby-actions">
    <button id="btnCreate" class="btn primary wide" type="button">＋ 建立房間</button>
  </div>
  <form id="createForm" class="card create" hidden autocomplete="off">
    <label>房名<input id="cName" maxlength="32" placeholder="（選填）"></label>
    <label>玩法
      <select id="cMode">
        <option value="xq" selected>象棋</option>
        <option value="dk">暗棋（4×8 翻棋）</option>
      </select>
    </label>
    <label>時間規則
      <select id="cTc">
        <option value="fast">快棋　3 分 + 2 秒</option>
        <option value="std" selected>標準　10 分 + 10 秒</option>
        <option value="slow">慢棋　30 分 + 20 秒</option>
      </select>
    </label>
    <label>執子
      <select id="cColor">
        <option value="r" id="cColorR">執紅（先手）</option>
        <option value="x">隨機</option>
      </select>
    </label>
    <div class="row">
      <button class="btn primary" type="submit">建立</button>
      <button id="cCancel" class="btn" type="button">取消</button>
    </div>
  </form>
  <p class="muted small" id="roomCount"></p>
  <ul id="roomList" class="room-list"></ul>
  <p id="roomEmpty" class="muted center">目前沒有房間，建立一個吧！</p>
</section>

<!-- 對局 -->
<section id="scrGame" class="screen game" hidden>
  <div class="pbar" id="barTop">
    <span class="on"></span><span class="side"></span><span class="pname"></span>
    <span class="caps"></span><span class="clock">--:--</span>
  </div>
  <div class="board-wrap">
    <div id="board" class="board">
      <svg id="lines" class="lines" viewBox="0 0 9 10" aria-hidden="true"></svg>
      <div id="marks" class="layer"></div>
      <div id="pieces" class="layer"></div>
      <div id="hints" class="layer"></div>
    </div>
  </div>
  <div class="pbar" id="barBot">
    <span class="on"></span><span class="side"></span><span class="pname"></span>
    <span class="caps"></span><span class="clock">--:--</span>
  </div>
  <div class="gstatus">
    <div id="gStatus"></div>
    <div id="gLast" class="last" hidden></div>
    <div id="gNote" class="note" hidden></div>
    <div id="gInfo" class="muted small"></div>
  </div>
  <div class="actions" id="actions">
    <button id="aEnd" class="btn primary" type="button" hidden>結束回合</button>
    <button id="aUndo" class="btn" type="button">悔棋</button>
    <button id="aDraw" class="btn" type="button">提和</button>
    <button id="aResign" class="btn danger" type="button">認輸</button>
    <button id="aAgain" class="btn primary" type="button" hidden>再來一局</button>
    <button id="aFlip" class="btn" type="button">翻轉</button>
    <button id="aLobby" class="btn" type="button">大廳</button>
  </div>
  <details class="moves" id="movesBox">
    <summary id="movesSum">走子記錄</summary>
    <ol id="moveList"></ol>
  </details>
</section>

<!-- 通用對話框（非瀏覽器原生 alert/confirm） -->
<div id="modal" class="modal" hidden>
  <div class="card modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mBtns" class="row"></div>
  </div>
</div>

<script src="/xiangqi.js"></script>
<script src="/anqi.js"></script>
<script src="/app.js"></script>
</body>
</html>
